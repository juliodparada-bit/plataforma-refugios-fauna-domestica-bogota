name: mestizo

services:
  postgres:
    image: postgres:16-alpine
    container_name: refugios-pg
    environment:
      POSTGRES_USER: refugios
      POSTGRES_PASSWORD: refugios_dev
      POSTGRES_DB: refugios
    ports:
      - "5433:5432"
    volumes:
      - refugios_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refugios -d refugios"]
      interval: 3s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./api
    container_name: refugios-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://refugios:refugios_dev@postgres:5432/refugios?schema=public
      JWT_SECRETO: ${JWT_SECRETO:-cambia-este-secreto-en-local}
      WEB_ORIGEN: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173
      PUERTO: "3000"
      VALIDADOR_CLAVE_INICIAL: ${VALIDADOR_CLAVE_INICIAL:-CambiaEsto123}
      MESTIZO_SEED: ${MESTIZO_SEED:-1}
    ports:
      - "3000:3000"
    volumes:
      - refugios_uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/localidades').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  web:
    build:
      context: ./web
    container_name: refugios-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  refugios_pg:
    name: refugios_pg
  refugios_uploads:
    name: refugios_uploads
